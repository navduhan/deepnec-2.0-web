map $request_method $deepnec_predict_key { POST $binary_remote_addr; default ""; }
map $request_method $deepnec_status_key { GET $binary_remote_addr; default ""; }
limit_req_zone $deepnec_predict_key zone=deepnec_predict:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=deepnec_api:10m rate=10r/m;
limit_req_zone $deepnec_status_key zone=deepnec_status:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=deepnec_conn:10m;

server {
    listen 3365;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location = /deepnec-2.0/api/predict {
        limit_conn deepnec_conn 3;
        limit_req zone=deepnec_predict burst=2 nodelay;
        limit_req zone=deepnec_status burst=10 nodelay;
        proxy_pass http://app:3365;
    }

    location ~ ^/deepnec-2\.0/api/(accession|fasta-check)$ {
        limit_req zone=deepnec_api burst=5 nodelay;
        limit_conn deepnec_conn 5;
        proxy_pass http://app:3365;
    }

    location ~ ^/deepnec-2\.0/api/structure/(secondary|tertiary)$ {
        limit_req zone=deepnec_api burst=2 nodelay;
        limit_conn deepnec_conn 2;
        proxy_send_timeout 30s;
        proxy_read_timeout 12m;
        proxy_pass http://app:3365;
    }

    location ^~ /deepnec-2.0/download/ {
        limit_conn deepnec_conn 1;
        limit_rate_after 10m;
        limit_rate 20m;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://app:3365;
    }

    location / {
        limit_conn deepnec_conn 20;
        proxy_pass http://app:3365;
    }
}
